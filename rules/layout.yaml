# ============================================================================
#  shijuan-paiban 排版规则单一事实源 (single source of truth)
# ----------------------------------------------------------------------------
#  本文件是规则的唯一权威定义。SKILL.md / README.md / docs/conversion-rules.md
#  中的规则表格由 scripts/gen_rules_doc.py 从本文件生成，生成区块禁止手改。
#
#  约束：
#  1. 每条规则必须有唯一 id，格式 <SCOPE>-<TOPIC>-<序号>
#  2. 每条规则必须有 evidence（真实案例或实测依据）—— 无证据的规则不予收录
#  3. check 字段非 null 时，必须能在 scripts/validate_tex.py 中找到同名检查
#  4. 改规则只改本文件，然后运行：python scripts/gen_rules_doc.py
# ============================================================================

version: 3
updated: "2026-11-07"

scopes:
  structure: 结构约束
  image: 图片排版
  options: 选项排版
  numbering: 题目编号
  spacing: 间距与页数
  answer: 答题空间
  extraction: 输入提取
  artifacts: 产物规范
  access: 访问约束

rules:

  # ══════════════════════ 结构约束 ══════════════════════
  - id: STRUCT-ENV-001
    scope: structure
    title: 选择题外层容器
    value: "外层 enumerate + 内层 tasks"
    forbidden:
      - 单独使用 tasks 作为题目列表容器
    severity: error
    check: env_nesting
    evidence: tasks 环境无编号能力，单独使用导致题目无序号

  - id: STRUCT-ENV-002
    scope: structure
    title: 解答题环境
    value: "examenum"
    severity: error
    check: env_nesting
    evidence: 模板以 newlist 定义三级嵌套 examenum，普通 enumerate 无法复用模板缩进体系

  - id: STRUCT-BLANK-001
    scope: structure
    title: 填空题空位
    value: "\\blank（模板已定义，下划线 2cm）"
    severity: error
    check: fill_blank_marker
    evidence: 自造下划线导致同一份试卷内空位宽度不一致

  - id: STRUCT-GLYPH-001
    scope: structure
    title: 圈号字符 ①-⑩ 字形映射
    value: "导言区用 newunicodechar 把 ①-⑩ 映射到 \\mycircled"
    severity: warning
    check: circled_glyph
    evidence: ctexart 默认字体缺 ①-⑩ 字形，直接写会静默丢字——题干「如图①②③所示」渲染成「如图 所示」且编译不报错（ir_geometry 实测）

  - id: STRUCT-DIV-001
    scope: structure
    title: 卷部分分隔线（第 I/II 卷）
    type: decision
    cases:
      - when: 选择题部分开始处（单选+多选+填空之前）
        value: "\\textbf{第I卷（选择题部分（共 <分值> 分））}"
      - when: 解答题部分开始处（四、解答题标题之前）
        value: "\\textbf{第II卷（非选择题，共 <分值> 分）}"
    severity: warning
    check: null
    evidence: 用户 2026-11 确认的标准格式（2611金华十校实排）：卷号用半角罗马字母 I/II（勿用 Ⅱ 全角字形，字体可能缺字），第I卷外层括号内嵌套「（共 N 分）」双层括号写法；第II卷为单层括号「非选择题，共 N 分」。分值随卷计算；无分值信息时省略括号只写「第I卷（选择题部分）」。源 markdown 中「第Ⅱ卷(非选择题…)」说明性标题仍按 md2exam 的 section_note 逻辑跳过，不注册题型区块

  # ══════════════════════ 图片排版 ══════════════════════
  - id: IMG-W-001
    scope: image
    title: 单张图片宽度硬上限
    value: "0.35\\textwidth"
    severity: error
    check: image_max_width
    evidence: 超过 0.35 时图注被挤出页边（2024 新课标Ⅱ卷第 19 题实测）

  - id: IMG-W-002
    scope: image
    title: 单张题目配图默认宽度
    value: "0.30\\textwidth"
    severity: warning
    check: null
    evidence: 0.30 在 4 页卷中留出足够文本环绕空间，与 IMG-W-001 的硬上限不冲突

  - id: IMG-W-003
    scope: image
    title: 并排图片宽度与高度
    type: table
    rows:
      - k: "2 张并排"
        v: "minipage 0.42\\textwidth，图高 3cm"
      - k: "3 张并排"
        v: "minipage 0.28\\textwidth，图高 2.5cm"
    severity: error
    check: multi_image_height
    evidence: 并排不限高时三视图会把整道题顶到下一页

  - id: IMG-W-004
    scope: image
    title: 选项图片宽度
    value: "0.12\\textwidth"
    severity: warning
    check: null
    evidence: 4 × 0.12 = 0.48，为 label 与 column-sep 留出余量

  - id: IMG-ALIGN-001
    scope: image
    title: 图片对齐方式（一般场景）
    value: "\\centering"
    forbidden:
      - "\\raggedleft"
    severity: error
    check: image_align
    evidence: raggedleft 使图注与图片左边缘错位，图注必须居中于图片正下方；立体几何解答题配图例外，见 IMG-ALIGN-002

  - id: IMG-ALIGN-002
    scope: image
    title: 立体几何大题配图对齐
    type: decision
    cases:
      - when: 解答题立体几何题单个立体图（TikZ 或图片）
        value: "flushright 靠右（图与图注如「（第 16 题图）」均右对齐）"
      - when: 解答题立体几何题多张图（如折叠前后图 1/图 2）
        value: "center 居中并排（minipage 并排 + 各自图注）"
      - when: 选择题/填空题配图
        value: "center 居中（遵循 IMG-ALIGN-001）"
    severity: error
    check: null
    evidence: 用户 2026-11 实排确认：立体几何解答题单图靠右更贴近原卷版式（2611金华十校第 16 题实测，flushright 环境；注意 LaTeX 无 right 环境）；多图并排保持居中（2611嘉兴一模第 17 题图 1/图 2 实测）

  - id: IMG-SCENE-001
    scope: image
    title: 图片场景选择
    type: decision
    cases:
      - when: 小装饰图（行内）
        value: "\\includegraphics[height=0.6em]"
      - when: 列表内单图（无论有无子问）
        value: "minipage 左右并排（0.62 文字 + 0.30 图片）"
      - when: 图片作为选项
        value: "tasks(4)，图宽 0.12\\textwidth"
      - when: 图片与长选项并排
        value: "minipage 左选项右图片"
      - when: 多张图片并排
        value: "figure[H] + minipage，必须限高"
      - when: TikZ 图
        value: "\\resizebox{0.35\\textwidth}{!}{...}"
      - when: 图片位于 \\begin{examenum} 之前（列表外）
        value: "wrapfigure{r}{0.30\\textwidth} 右侧环绕"
    severity: error
    check: wrapfigure_in_list
    evidence: 实测 wrapfigure 放在 examenum 列表内会静默丢图——图片完全不渲染且编译不报错（evals/fixtures/ir_geometry 第 2 题）。因此列表内单图一律走 minipage，wrapfigure 仅限列表外场景

  # ══════════════════════ 选项排版 ══════════════════════
  - id: TASKS-COL-001
    scope: options
    title: tasks 列数判定
    type: decision
    cases:
      - when: 含图片且平均长度 < 80 字符
        value: 4 列
      - when: 含图片且平均长度 ≥ 80 字符
        value: 2 列
      - when: 平均可见长度 > 25 字符（含公式或纯文字）
        value: 2 列
      - when: 默认（简短选项，含短公式如 $\{0\}$）
        value: 4 列
    severity: warning
    check: tasks_cols
    evidence: 原规则「含公式即 2 列」会把 $\{0\}$ 这类短选项也判成 2 列，与真实试卷排版不符（evals/fixtures/standard 实测）；改为只看可见长度

  - id: TASKS-COL-002
    scope: options
    title: 禁止竖排图片选项
    value: "禁止图片选项使用 tasks(1)"
    severity: error
    check: tasks_single_col_image
    evidence: 图片竖排浪费半页空间，且与相邻题目间距失衡。注：纯文字选项因单个选项过长而用 tasks(1) 不受此限（见 TASKS-COL-003）

  - id: TASKS-COL-003
    scope: options
    title: 宽度兜底——放不下就退列
    type: decision
    cases:
      - when: 意图列数的单列宽度放不下最长选项
        value: 退到 2 列
      - when: 2 列仍放不下
        value: 退到 1 列（纯文字选项允许）
    severity: error
    check: tasks_cols
    evidence: 只按字符数判列会低估不可断行公式的真实宽度。实测 $\dfrac{\tanh x+\tanh y}{1+\tanh x\tanh y}$ 渲染宽 86.53pt（newtxmath 12pt），整体选项 286.3pt，而 tasks(2) 每列仅 200.4pt → 溢出 51.46pt（route_cmp 双路线对比测试）。改为按实测宽度模型（scripts/tex_width.py）判定，放不下就退列

  # ══════════════════════ 题目编号 ══════════════════════
  - id: ENUM-START-001
    scope: numbering
    title: 解答题起始编号
    value: "start = 单选题数 + 多选题数 + 填空题数 + 1"
    severity: error
    check: examenum_start
    evidence: 8+3+3 配置 → start=15；手算错误是历史最高频问题

  - id: ENUM-RESUME-001
    scope: numbering
    title: 答案文档编号衔接
    value: "第一个 enumerate 不带 start，后续统一用 [resume]"
    severity: error
    check: answer_resume
    evidence: 各题型独立计数会使答案文档编号从 1 反复重新开始

  # ══════════════════════ 间距与页数 ══════════════════════
  - id: PAGE-001
    scope: spacing
    title: 试卷页数
    value: "严格匹配试卷标注页数"
    severity: error
    check: page_count
    evidence: 试卷标注「共 4 页」而实际 5 页属硬伤

  - id: PAGE-002
    scope: spacing
    title: 超页压缩手段（按优先级）
    type: list
    items:
      - 减小解答题 itemsep
      - "导言区加 \\linespread{1.05}\\selectfont"
      - 最后手段：调整 margin
    severity: warning
    check: null
    evidence: 先动行距会破坏整体观感，应优先调 itemsep

  - id: PAGE-003
    scope: spacing
    title: 解答题 itemsep 经验值
    type: table
    rows:
      - k: "4 页 3 题"
        v: "2.0 ~ 2.5cm"
      - k: "4 页 4 题"
        v: "1.8 ~ 2.2cm"
      - k: "4 页 5 题"
        v: "1.5 ~ 2.0cm"
      - k: "4 页 6 题"
        v: "1.2 ~ 1.5cm"
      - k: "itemsep < 1.0cm 仍超页"
        v: "降 linespread 至 0.95"
    severity: warning
    check: null
    evidence: 10 份高考试卷实测区间

  # ══════════════════════ 答题空间 ══════════════════════
  - id: ANS-001
    scope: answer
    title: 答题空间命令与留白量
    type: table
    rows:
      - k: "\\answern"
        v: "3em，normal 模式（作业，默认）"
    severity: error
    check: answer_space
    evidence: 命令定义在 templates/gaokao-template.tex 导言区

  - id: ANS-002
    scope: answer
    title: 答题空间插入位置
    value: "每道解答题 \\item 内容结束后；最后一道解答题不插入"
    severity: warning
    check: answer_space_last
    evidence: 末题插入会在页尾留大片空白

  - id: ANS-003
    scope: answer
    title: 答题空间禁止线条
    value: "仅用 \\vspace 留白"
    forbidden:
      - "\\rule"
      - tcolorbox
      - "\\fbox"
      - 虚线
      - 角标
    severity: error
    check: answer_space_lines
    evidence: 用户明确要求纯留白，保持试卷整洁

  # ══════════════════════ 输入提取 ══════════════════════
  - id: EXTRACT-001
    scope: extraction
    title: 图片目录命名
    type: table
    rows:
      - k: 任意输入（DOCX / PDF，试题或答案）
        v: "Images-<文件名去扩展名>（与 ARTIFACT-003 一致，试题不再用 media）"
    severity: error
    check: graphicspath_match
    evidence: graphicspath 与目录名不一致时图片全部丢失且不报错；统一 Images-<卷名> 与题库既有约定对齐

  - id: EXTRACT-002
    scope: extraction
    title: 扫描件判定
    value: "pandoc 输出仅含 ![](media/imageN.png) 且无正文 → 走 MinerU OCR"
    severity: warning
    check: null
    evidence: 扫描件 DOCX 用 pandoc 只能拿到整页图片，提取不到任何文字

  - id: EXTRACT-003
    scope: extraction
    title: WMF 转 PNG
    value: "Pillow 渲染，600 DPI"
    severity: warning
    check: no_wmf_remaining
    evidence: xelatex 不直接支持 WMF，残留 WMF 会导致编译失败

  # ══════════════════════ 产物规范 ══════════════════════
  - id: ARTIFACT-001
    scope: artifacts
    title: 试题卷标准产物集
    type: table
    rows:
      - k: 试卷
        v: "<卷名>.tex / .pdf（含 \\answern 答题空间，学生版/教师版合并后的唯一版本）"
      - k: 答题卡
        v: "2611数学答题卡（A4）-<考试名>.tex / .pdf + 2611数学答题卡（A3）-<考试名>.tex / .pdf"
      - k: 图片文件夹
        v: "Images-<卷名>/"
      - k: 编译脚本
        v: build.py
    severity: error
    check: null
    evidence: 用户确认的三件套需求；学生版与教师版合并为唯一试卷版本（render_tex.py 直接产出，含 \answern 答题空间），-学生版/-教师版 后缀废止；与题库每卷 Images-* + build.py 的既有整理约定一致；答案文档（文件名含答案）只出 tex/.pdf + Images + build.py 三件

  - id: ARTIFACT-002
    scope: artifacts
    title: 产物命名后缀表
    type: table
    rows:
      - k: 答题卡 A4
        v: "2611数学答题卡（A4）-<考试名>（由 gen_answer_sheet.py 的 sheet_stem() 统一推导：源卷名含「数学卷/数学试卷-」前缀时去前缀换「数学答题卡（A4/A3）-」，数字前缀随源卷保留；否则回退旧格式 <卷名>-答题卡-A4）"
      - k: 答题卡 A3
        v: "2611数学答题卡（A3）-<考试名>（推导规则同上）"
    forbidden:
      - "-学生版（学生版/教师版已合并，后缀废止）"
      - "-教师版（学生版/教师版已合并，后缀废止）"
      - "-答题空间（旧名，已废弃）"
    severity: error
    check: null
    evidence: 学生版与教师版合并为唯一试卷版本 <卷名>.tex，不再有版本后缀；答题卡名与试卷名共享同一 <考试名> 主体

  - id: ARTIFACT-003
    scope: artifacts
    title: 图片文件夹统一命名
    value: "Images-<卷名>（试题与答案一致，替代旧约定 media）"
    severity: error
    check: null
    evidence: 题库每卷 Images-* 目录的既有约定；试题用 media 与答案用 Images-* 双标准增加记忆负担

  - id: ARTIFACT-004
    scope: artifacts
    title: 收尾与部署
    value: "每个含 tex 的试卷目录部署通用版 build.py；排版完成后用 scripts/finalize_paper.py 一键补齐产物集、编译并清理 preview-*.png"
    severity: warning
    check: null
    evidence: finalize_paper.py 端到端实测（生成答题卡、部署 build.py、编译成功、清单全 OK）；学生版/教师版合并后收尾仅补答题卡与编译

  # ══════════════════════ 访问约束 ══════════════════════
  - id: ACCESS-001
    scope: access
    title: 技能安装目录只读
    value: "使用技能处理试卷期间，{SKILL_DIR} 只读：不得在其中新建、修改、删除任何文件"
    forbidden:
      - 在 {SKILL_DIR} 下写 paper.json / .tex / .pdf / 图片 / 日志
      - 在 {SKILL_DIR} 下生成 __pycache__ / log-runtime / preview-*.png
      - 修改技能自带脚本、模板、规则（维护技能时除外）
    severity: error
    check: null
    evidence: 用户 2026-11 明确要求：使用本 skill 时只能以只读形式访问安装目录；所有可写内容放试卷工作目录

  - id: ACCESS-002
    scope: access
    title: 临时脚本统一放 temp_scripts 并隐藏
    value: "每卷的提取/转换/排版临时脚本统一放 <试卷工作目录>/temp_scripts/ 并从该目录运行；收尾时重命名为 .temp_scripts 并设置 Windows 隐藏属性"
    forbidden:
      - 在试卷工作目录根部散落 *.py 临时脚本
      - 在 {SKILL_DIR} 内存放临时脚本
      - 收尾后保留可见的 temp_scripts/
    severity: error
    check: null
    evidence: 用户 2026-11 要求：对应试卷的提取和排版脚本在对应文件夹新建 temp_scripts 目录存储和使用，完成后隐藏；跨平台隐藏采用 .temp_scripts 点前缀，Windows 下同时设置 FILE_ATTRIBUTE_HIDDEN，资源管理器默认不可见
